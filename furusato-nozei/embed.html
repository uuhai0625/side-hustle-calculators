<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ふるさと納税 控除上限額シミュレーター(埋め込み版)|AI副業そろばん</title>
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  /* 埋め込み版専用の最小調整。サイト共通のheader/footer/余白は使わず、
     iframeの枠いっぱいにカードだけを表示する。 */
  body { background: var(--bg); margin: 0; padding: 12px; }
  .wrap.embed-wrap { max-width: 420px; padding: 0; }
  .embed-brand {
    display: block;
    text-align: center;
    font-size: 0.72rem;
    color: var(--ink-sub);
    margin-top: 10px;
    text-decoration: none;
  }
  .embed-brand:hover { color: var(--navy); }
  .embed-brand strong { color: var(--navy); }
</style>
</head>
<body>

<main class="wrap embed-wrap">
  <div class="calc-card">
    <div class="field">
      <label for="input-salary">給与収入(額面年収、円)</label>
      <input type="text" id="input-salary" inputmode="numeric" pattern="[0-9,]*" placeholder="例: 5,000,000">
    </div>
    <div class="field">
      <label for="select-spouse">配偶者控除</label>
      <select id="select-spouse">
        <option value="0" selected>なし</option>
        <option value="1">あり</option>
      </select>
      <span class="field-hint">配偶者の2026年の年収が136万円以下(パート・アルバイト収入だけの場合。合計所得金額なら62万円以下)なら「あり」を選んでください。136万円を超え207万円以下(配偶者特別控除の対象)の場合も「あり」を選ぶと、少なめ(安全側)の目安になります。</span>
    </div>
    <div class="field">
      <label for="input-dependents">扶養家族の人数(16歳以上・一般)</label>
      <input type="number" id="input-dependents" inputmode="numeric" min="0" max="10" step="1" value="0">
    </div>
    <div class="field">
      <label for="input-side-income">副業の年間収入(円)</label>
      <input type="text" id="input-side-income" inputmode="numeric" pattern="[0-9,]*" value="500000">
    </div>
    <div class="field">
      <label for="input-side-expense">副業の年間必要経費(円)</label>
      <input type="text" id="input-side-expense" inputmode="numeric" pattern="[0-9,]*" value="100000">
      <span class="field-hint">「利益(収入−経費)」を給与所得に合算します。</span>
    </div>
    <div class="field">
      <label for="select-side-type">副業の所得区分</label>
      <select id="select-side-type">
        <option value="zatsu" selected>雑所得</option>
        <option value="white">事業所得(白色申告)</option>
        <option value="blue10">事業所得(青色申告・10万円控除)</option>
        <option value="blue65">事業所得(青色申告・65万円控除)</option>
      </select>
    </div>

    <button class="btn-calc" id="btn-calc" type="button">控除上限額を計算する</button>
  </div>

  <div class="result-card" id="result-card" role="status" aria-live="polite">
    <p class="result-label">ふるさと納税 控除上限額の目安(年間)</p>
    <p class="result-amount"><span class="yen">¥</span><span id="result-amount">--</span></p>
    <p class="result-note" id="result-note"></p>
    <p class="clamp-notice" id="result-clamp-notice"></p>
  </div>

  <a class="embed-brand" href="https://uuhai0625.github.io/side-hustle-calculators/furusato-nozei/" target="_blank" rel="noopener">
    <strong>AI副業そろばん</strong>の副業対応ふるさと納税シミュレーター(詳しい解説・返礼品はこちら)
  </a>
</main>

<script src="../ga.js"></script>
<script src="embed.js"></script>
</body>
</html>
